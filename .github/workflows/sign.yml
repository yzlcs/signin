name: Daily Sign In

on:
  schedule:
    # 每天 UTC 时间 00:00 运行 (也就是北京时间早上 8:00)
    # 如果你想改时间，可以搜索 "cron generator" 生成新的时间
    - cron: '0 0 * * *'
  
  # 允许手动点击运行
  workflow_dispatch:

jobs:
  sign-in:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18' # 使用 Node.js 18 版本

      - name: Run Sign In Script
        env:
          # 将 GitHub Secret 注入到环境变量
          KLW_COOKIE: ${{ secrets.KLW_COOKIE }}
        run: node index.js
