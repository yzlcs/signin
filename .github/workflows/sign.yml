name: 每日自动签到

on:
  schedule:
    # 每天 UTC 01:00 运行 (北京时间 09:00)
    - cron: '0 1 * * *'
  workflow_dispatch:

jobs:
  checkin:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout code
      - name: 检出代码
        uses: actions/checkout@v6

      # 2. Setup Node.js environment
      - name: 设置 Node.js 环境
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'

      # 3. Install dependencies
      - name: 安装依赖
        run: npm install

      # 4. Run the script
      - name: 运行脚本
        env:
          KLM_USERNAME: ${{ secrets.KLM_USERNAME }}
          KLM_PASSWORD: ${{ secrets.KLM_PASSWORD }}
        run: node index.js
