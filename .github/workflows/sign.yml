name: Daily Auto Sign-in

on:
  schedule:
    # Runs at 01:00 UTC every day (09:00 Beijing Time)
    - cron: '0 1 * * *'
  workflow_dispatch:

jobs:
  checkin:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Setup Node.js environment
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # 3. Install dependencies
      - name: Install dependencies
        run: npm install

      # 4. Run the script
      - name: Run Script
        env:
          KLW_USERNAME: ${{ secrets.KLW_USERNAME }}
          KLW_PASSWORD: ${{ secrets.KLW_PASSWORD }}
        run: node index.js
