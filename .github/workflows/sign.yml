name: Daily Sign In

on:
  schedule:
    # 每天 UTC 时间 00:00 运行 (北京时间早上 8:00)
    - cron: '0 0 * * *' 
  
  # 允许手动点击运行
  workflow_dispatch:

jobs:
  sign-in:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        # ✅ 升级到 v6 (最新版)
        uses: actions/checkout@v6

      - name: Setup Node.js
        # ✅ 升级到 v4 并指定 Node.js 24 (消除警告的核心)
        uses: actions/setup-node@v4
        with:
          node-version: '24' 

      - name: Run Sign In Script
        env:
          # 将 GitHub Secret 注入到环境变量
          KLW_COOKIE: ${{ secrets.KLW_COOKIE }}
        run: node index.js
