name: Daily Sign In

on:
  schedule:
    - cron: '0 1 * * *'
  
  workflow_dispatch:

jobs:
  sign-in:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js (Latest)
        uses: actions/setup-node@v4
        with:
          node-version: 'latest'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Run Sign In Script
        env:
          KLW_USERNAME: ${{ secrets.KLW_USERNAME }}
          KLW_PASSWORD: ${{ secrets.KLW_PASSWORD }}
        run: node index.js
