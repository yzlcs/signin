name: 每日自动签到

# 触发条件
on:
  schedule:
    # 每天北京时间 09:00 运行 (对应 UTC 01:00)
    - cron: '0 1 * * *'
  # 允许手动点击按钮运行
  workflow_dispatch:

jobs:
  checkin:
    runs-on: ubuntu-latest

    steps:
      # 1. 拉取代码
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. 设置 Node.js 环境
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # 3. 安装依赖
      - name: Install dependencies
        run: npm install

      # 4. 运行脚本
      - name: Run Script
        env:
          KLW_USERNAME: ${{ secrets.KLW_USERNAME }}
          KLW_PASSWORD: ${{ secrets.KLW_PASSWORD }}
        run: node index.js